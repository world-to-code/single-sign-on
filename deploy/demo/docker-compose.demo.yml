# Single-server demo of the split deployment: Caddy terminates TLS and fronts the nginx edge, which serves the SPA
# and reverse-proxies the API-only backend - one public origin, exactly as docker-compose.prod.yml, plus HTTPS.
# PostgreSQL and Valkey are Vultr Managed Databases reached over TLS; only the stateless tier runs here.
#
#   ./deploy.sh                      # on the server, after .env is filled in (see README.md)
#
# Only Caddy publishes ports (80, 443); MailHog's UI is bound to the server's loopback.
services:
  # Fallback when the managed Valkey has keyspace notifications off (./check-valkey.sh): run it here instead.
  # Enabled by setting VALKEY_HOST=valkey in .env (deploy.sh then adds --profile local-valkey).
  valkey:
    image: valkey/valkey:8
    profiles: ["local-valkey"]
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD}", "--notify-keyspace-events", "Egx",
              "--maxmemory", "256mb", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$${VALKEY_PASSWORD}\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # `ssh -L 8025:localhost:8025 <server>` then http://localhost:8025

  backend:
    image: svalinn-backend:demo
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-Xmx1800m -XX:MaxMetaspaceSize=256m"
      # --- managed PostgreSQL 17 (TLS required; the prod profile defaults to sslmode=require) ---
      DB_URL: jdbc:postgresql://${DB_HOST:?fill in .env}:${DB_PORT:?fill in .env}/${DB_NAME:-sso}
      DB_USERNAME: ${DB_ADMIN_USER:?fill in .env}          # schema owner: Flyway migrates as this
      DB_PASSWORD: ${DB_ADMIN_PASSWORD:?fill in .env}
      DB_APP_USERNAME: sso_app                             # non-superuser runtime role (RLS enforced)
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?run ./gen-env.sh first}
      # --- managed Valkey (TLS, ACL user) ---
      REDIS_HOST: ${VALKEY_HOST:?fill in .env}
      REDIS_PORT: ${VALKEY_PORT:?fill in .env}
      REDIS_PASSWORD: ${VALKEY_PASSWORD:?fill in .env}
      SPRING_DATA_REDIS_USERNAME: ${VALKEY_USER:-default}
      SPRING_DATA_REDIS_SSL_ENABLED: ${VALKEY_TLS:-true}
      # Managed Valkey usually refuses CONFIG SET; keyspace events must then be on server-side (./check-valkey.sh).
      SSO_SESSION_REDIS_CONFIGURE_KEYSPACE_EVENTS: ${VALKEY_CONFIGURE_KEYSPACE_EVENTS:-false}
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      # --- the public origin ---
      SSO_ISSUER: https://${DEMO_HOST:?run ./gen-env.sh first}
      SSO_CORS_ORIGINS: https://${DEMO_HOST}
      SSO_ADMIN_CONSOLE_REDIRECT_URIS: https://${DEMO_HOST}/admin/callback
      SSO_SAML_ENTITY_ID: https://${DEMO_HOST}/saml2/idp/metadata
      SSO_TENANT_BASE_DOMAINS: ${DEMO_HOST}
      SSO_ONBOARDING_ACTIVATE_URL: https://${DEMO_HOST}/activate
      SSO_ONBOARDING_SET_PASSWORD_URL: https://{slug}.${DEMO_HOST}/set-password
      SSO_ONBOARDING_WORKSPACE_URL_TEMPLATE: https://{slug}.${DEMO_HOST}
      SSO_TRUSTED_PROXIES: "10\\..*|172\\.(1[6-9]|2[0-9]|3[01])\\..*|192\\.168\\..*"
      # --- secrets generated by ./gen-env.sh ---
      SSO_ADMIN_PASSWORD: ${SSO_ADMIN_PASSWORD}
      SSO_SAML_KEYSTORE_PASSWORD: ${SSO_SAML_KEYSTORE_PASSWORD}
      SSO_CRYPTO_MASTER_PASSWORD: ${SSO_CRYPTO_MASTER_PASSWORD}
      SSO_CRYPTO_SALT: ${SSO_CRYPTO_SALT}
      SSO_DEMO_CLIENT_ENABLED: "false"
    volumes:
      - saml-data:/data

  frontend:
    image: svalinn-frontend:demo
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DEMO_HOST: ${DEMO_HOST}   # rendered into the on-demand TLS ask endpoint (nginx/caddy-ask.conf.template)
    volumes:
      # Same edge as production, except it runs behind Caddy: the scheme and client address come from Caddy.
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/caddy-ask.conf.template:/etc/nginx/templates/caddy-ask.conf.template:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DEMO_HOST: ${DEMO_HOST}
      DEMO_TENANT: ${DEMO_TENANT:-default}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-sites:/etc/caddy/sites:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  valkey-data:
  saml-data:
  caddy-data:
  caddy-config:
